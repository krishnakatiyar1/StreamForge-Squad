<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Create admin account | CampusConnect</title><link rel="stylesheet" href="/styles.css" /></head>
<body class="admin-page"><main class="admin-login-shell"><a class="logo" href="/"><b>C</b> Campus<span>Connect</span></a><section class="admin-login-card"><p class="kicker dark">AUTHORIZED STAFF ONLY</p><h1>Create admin account</h1><p>Use the college credential ID to register an administrator account.</p>
<form id="admin-register-form"><label>Administrator email<input name="email" type="email" autocomplete="email" required /></label><label>Create password<input name="password" type="password" minlength="12" autocomplete="new-password" required /></label><label>College credential ID<input name="credentialId" type="password" autocomplete="off" required /></label><p class="form-message" role="status"></p><button class="btn gold" type="submit">Create admin account</button></form>
<p class="admin-switch">Already registered? <a href="/admin">Sign in</a></p></section></main>
<script>const form=document.querySelector("#admin-register-form"),message=form.querySelector(".form-message");form.onsubmit=async(event)=>{event.preventDefault();const button=form.querySelector("button");button.disabled=true;message.textContent="Creating account...";try{const response=await fetch("/api/admin/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),data=await response.json();if(!response.ok)throw new Error(data.error);location.href="/admin";}catch(error){message.className="form-message error";message.textContent=error.message||"Unable to create account.";}finally{button.disabled=false;}};</script></body></html>
