<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>User information | CampusConnect Admin</title><link rel="stylesheet" href="/styles.css" /></head>
<body class="admin-page"><header class="plain admin-header"><a class="logo" href="/"><b>C</b> Campus<span>Connect</span></a><button id="logout-button">Log out</button></header><main class="admin-dashboard"><p class="kicker dark">ACCOUNTS</p><h1>User information</h1><p><a class="back-link" href="/admin/dashboard">← Back to applications</a></p><p id="user-count" class="admin-summary">Loading registered users...</p><div class="applications-table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Account created</th></tr></thead><tbody id="users-list"></tbody></table></div></main>
<script>const list=document.querySelector("#users-list"),count=document.querySelector("#user-count"),escapeHtml=(value)=>String(value||"—").replace(/[&<>"']/g,(character)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[character]);async function loadUsers(){const response=await fetch("/api/admin/users");if(!response.ok)return location.href="/admin";const{users}=await response.json();count.textContent=`${users.length} registered user${users.length===1?"":"s"}`;list.innerHTML=users.length?users.map((user)=>`<tr><td><strong>${escapeHtml(user.name)}</strong></td><td>${escapeHtml(user.email)}</td><td>${new Date(user.createdAt).toLocaleString()}</td></tr>`).join(""):'<tr><td colspan="3" class="empty-row">No registered users yet.</td></tr>';}document.querySelector("#logout-button").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST"});location.href="/admin";};loadUsers();</script></body></html>
