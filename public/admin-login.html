<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin sign in | CampusConnect</title><link rel="stylesheet" href="/styles.css" /></head>
<body class="admin-page"><main class="admin-login-shell"><a class="logo" href="/"><b>C</b> Campus<span>Connect</span></a><section class="admin-login-card"><p class="kicker dark">RESTRICTED ACCESS</p><h1>Administrator sign in</h1><p>Sign in to review student applications.</p>
<form id="admin-login-form"><label>Administrator email<input name="email" type="email" autocomplete="username" required /></label><label>Password<input name="password" type="password" autocomplete="current-password" required /></label><label>Credential ID<input name="credentialId" type="password" autocomplete="off" required /></label><p class="form-message" role="status"></p><button class="btn gold" type="submit">Sign in securely</button></form>
<p class="admin-switch">New administrator? <a href="/admin/register">Create an admin account</a></p></section></main>
<script>const form=document.querySelector("#admin-login-form"),message=form.querySelector(".form-message");form.onsubmit=async(event)=>{event.preventDefault();const button=form.querySelector("button");button.disabled=true;message.textContent="Signing in...";try{const response=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),data=await response.json();if(!response.ok)throw new Error(data.error);location.href="/admin/dashboard";}catch(error){message.className="form-message error";message.textContent=error.message||"Unable to sign in.";}finally{button.disabled=false;}};</script></body></html>
